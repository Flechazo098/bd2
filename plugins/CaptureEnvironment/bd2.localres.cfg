[General]

## Redirect the official comparison client to the already downloaded local resources.
# Setting type: Boolean
# Default value: true
Enabled = true

## ServerData root. The selected version must exist below
## StandaloneWindows64/HD/<BundleVersion>/.
# Setting type: String
LocalCDN = <RESOURCE_ROOT>\ServerData

## GameData root. The selected version must contain
## <GameDataVersion>/release/common-dbdata.bin.
# Setting type: String
LocalGameData = <RESOURCE_ROOT>\GameData

# Setting type: String
BundleVersion = <BUNDLE_VERSION>

# Setting type: String
GameDataVersion = <GAME_DATA_VERSION>

# Setting type: String
Resolution = HD
