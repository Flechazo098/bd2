syntax = "proto3";

package bd2.state.v1;
option go_package = "bd2server/gen/state/v1;statev1";

// Frozen bridge DTO for the nine existing JSON persistence files. Version 1
// describes today's save; changes require state/v2, never editing old tags.
message Snapshot {
  uint32 format_version = 1;
  string client_version = 2;
  string game_data_version = 3;

  Progress progress = 10;
  Deck deck = 11;
  Inventory inventory = 12;
  EquipmentInventory equipment = 13;
  CharacterState characters = 14;
  Collection collection = 15;
  Wallet wallet = 16;
  MailState mail = 17;
  MissionState missions = 18;
}

message QuestKey {
  uint32 pack_id = 1;
  uint32 quest_id = 2;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Position {
  uint32 pack_id = 1;
  uint32 map_id = 2;
  Vector3 player = 3;
  // Client JSON must be echoed without accidental normalization.
  bytes original_json = 10;
  bytes colleague_positions_json = 11;
}

message QuestProgress {
  QuestKey key = 1;
  repeated uint32 values = 2;
}

message Progress {
  uint32 source_format_version = 1;
  Position position = 2;
  repeated uint32 cleared_tutorial_ids = 3;
  repeated QuestProgress quests = 4;
  repeated QuestKey cleared_quests = 5;
}

message DeckSlot {
  uint64 character_index = 1;
  uint64 costume_index = 2;
  uint64 slot = 3;
}

message Pair {
  uint64 key = 1;
  uint64 value = 2;
}

message Deck {
  string client_version = 1;
  repeated DeckSlot battle = 2;
  repeated DeckSlot field = 3;
  uint64 field_control_type = 4;
  repeated Pair waypoints = 5;
  repeated Pair selected_costumes = 6;
  repeated Pair bought_packs = 7;
  uint64 highest_battle_power = 8;
  uint64 portrait_costume_id = 9;
  uint64 auto_revive_catalyst = 10;
}

message Pictorial {
  uint64 id = 1;
  uint64 group_id = 2;
}

message Item {
  uint64 inventory_index = 1;
  uint64 id = 2;
  uint64 type = 3;
  uint64 count = 4;
  uint64 keep_flag = 5;
  uint64 time_value = 6;
  Pictorial pictorial = 7;
  uint64 sort_id = 8;
  uint64 use_count = 9;
}

message IndexedGrant {
  string identity = 1;
  repeated uint64 inventory_indices = 2;
}

message Inventory {
  string client_version = 1;
  uint64 next_index = 2;
  repeated Item items = 3;
  repeated string granted_identities = 4;
  repeated IndexedGrant grant_items = 5;
}

message EquipmentOption {
  uint64 group_id = 1;
  uint64 id = 2;
}

message Equipment {
  uint64 inventory_index = 1;
  uint64 id = 2;
  uint64 level = 3;
  uint64 use_char = 4;
  uint64 keep_flag = 5;
  uint64 lock_flag = 6;
  uint64 sort_id = 7;
  repeated EquipmentOption main_options = 8;
  repeated EquipmentOption sub_options = 9;
  EquipmentOption private_option = 10;
  repeated uint64 ranks = 11;
}

message NamedIndex {
  string identity = 1;
  uint64 inventory_index = 2;
}

message EquipmentInventory {
  string client_version = 1;
  uint64 next_index = 2;
  repeated Equipment equipment = 3;
  repeated NamedIndex grants = 4;
}

message Character {
  uint64 inventory_index = 1;
  uint64 id = 2;
  uint64 hp = 3;
  uint64 level = 4;
  uint64 costume_id = 5;
  uint64 exp = 6;
  uint64 use_costume = 7;
  uint64 talent_level = 8;
  uint64 talent_exp = 9;
  uint64 solidarity_reward = 10;
  uint64 expiry_time = 11;
  uint64 connect_potential_costume = 12;
  repeated Pictorial pictorial = 13;
}

message Costume {
  uint64 inventory_index = 1;
  uint64 id = 2;
  uint64 level = 3;
  uint64 use_char = 4;
  uint64 sort_id = 5;
  uint64 potential_id = 6;
  uint64 design_id = 7;
  uint64 burst_level = 8;
  uint64 time_value = 9;
  repeated Pictorial pictorial = 10;
}

message CharacterState {
  string client_version = 1;
  repeated Character characters = 2;
}

message NamedCount {
  string identity = 1;
  uint64 value = 2;
}

message GachaSelection {
  uint64 group_id = 1;
  uint64 slot = 2;
  uint64 item_id = 3;
}

message NamedSelections {
  string identity = 1;
  repeated GachaSelection selections = 2;
}

message GachaUser {
  uint64 group_id = 1;
  uint64 point = 2;
  uint64 total_buy_count = 3;
  uint64 one_free_pick_count = 4;
  uint64 one_cash_pick_count = 5;
  uint64 ten_free_pick_count = 6;
  uint64 ten_cash_pick_count = 7;
  uint64 exchange_item_count = 8;
  uint64 exchange_mileage_count = 9;
}

message NamedGachaUser {
  string identity = 1;
  GachaUser user = 2;
}

message GachaFixed {
  uint64 fixed_id = 1;
  uint64 type = 2;
  uint64 count = 3;
  int32 apply_sort_id = 4;
}

message NamedGachaFixed {
  string identity = 1;
  GachaFixed fixed = 2;
}

message GachaPointExchange {
  uint64 group_id = 1;
  uint64 count = 2;
}

message NamedGachaPointExchange {
  string identity = 1;
  GachaPointExchange exchange = 2;
}

message CostumeUpgrade {
  uint64 inventory_index = 1;
  uint64 costume_id = 2;
  uint64 before = 3;
  uint64 after = 4;
  uint64 sort_id = 5;
}

message CostumeExchange {
  uint64 inventory_index = 1;
  uint64 original_item_type = 2;
  uint64 original_item_id = 3;
  uint64 original_count = 4;
  uint64 exchange_item_type = 5;
  uint64 exchange_item_id = 6;
  uint64 exchange_count = 7;
  uint64 sort_id = 8;
}

message CollectionGrant {
  string identity = 1;
  repeated uint64 character_indices = 2;
  repeated uint64 costume_indices = 3;
  repeated CostumeUpgrade upgrades = 4;
  repeated CostumeExchange exchanges = 5;
  repeated uint64 view_costume_ids = 6;
  uint64 gacha_group_id = 7;
  uint64 gacha_point = 8;
  repeated GachaFixed gacha_fixed = 9;
  repeated uint64 selection_apply_sort_ids = 10;
}

message Collection {
  string client_version = 1;
  uint64 next_character_index = 2;
  uint64 next_costume_index = 3;
  repeated uint64 latest_preview = 4;
  uint64 preview_event_index = 5;
  bool preview_locked = 6;
  repeated Character characters = 7;
  repeated Costume costumes = 8;
  repeated NamedCount base_costume_levels = 9;
  repeated NamedSelections gacha_selections = 10;
  repeated NamedCount step_up_progress = 11;
  repeated NamedGachaUser gacha_users = 12;
  repeated NamedGachaFixed gacha_fixed = 13;
  repeated string gacha_applied = 14;
  repeated NamedGachaPointExchange gacha_point_exchanges = 15;
  bool gacha_count_corrected = 16;
  repeated CollectionGrant grants = 17;
}

message Wallet {
  string client_version = 1;
  uint64 gold = 2;
  uint64 free_jewelry = 3;
  uint64 jewelry = 4;
  uint64 mileage = 5;
  uint64 hope_powder = 6;
  repeated string granted_identities = 7;
  repeated string spent_identities = 8;
}

message MailState {
  string client_version = 1;
  repeated uint64 opened_mail_ids = 2;
}

message MissionState {
  string client_version = 1;
  repeated string completed = 2;
  repeated string claimed = 3;
  repeated NamedCount progress = 4;
}
