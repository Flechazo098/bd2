syntax = "proto3";

package bd2.state.control.v1;
option go_package = "bd2server/gen/state/control/v1;controlv1";

import "bd2/state/v1/state.proto";

message CheckRequest {
  uint32 bridge_api_version = 1;
  bytes source_sha256 = 2;
  bd2.state.v1.Snapshot snapshot = 10;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_WARNING = 1;
  SEVERITY_ERROR = 2;
}

message Violation {
  string code = 1;
  Severity severity = 2;
  repeated string path = 3;
  string message = 4;
  repeated uint64 related_ids = 5;
}

message CheckResponse {
  uint32 bridge_api_version = 1;
  bytes source_sha256 = 2;
  repeated Violation violations = 10;
}
