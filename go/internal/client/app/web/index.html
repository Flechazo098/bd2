const status={executable:null,resources:null,bepinex:null,config:null};
function payload(){const mode=document.querySelector('input[name="cdn"]:checked').value;return{game_directory:$('gameDir').value.trim(),server_origin:$('origin').value.trim(),cdn_mode:mode,local_resource_directory:mode==='local'?$('localResourceDir').value.trim():'',proxy_url:$('proxyMode').value==='manual'?$('proxyURL').value.trim():''}}

async function requireOrigin(){const value=$('origin').value.trim();let u;try{u=new URL(value)}catch{throw fail('launcher.error.origin_invalid','http://127.0.0.1:8080')}if(!['http:','https:'].includes(u.protocol)||u.username||u.password||u.search||u.hash||(u.pathname!=='/'&&u.pathname!==''))throw fail('launcher.error.origin_shape');const loopback=['localhost','127.0.0.1','[::1]'].includes(u.hostname.toLowerCase());if(u.protocol!=='https:'&&!loopback)throw fail('launcher.error.origin_https');$('origin').value=value.replace(/\/$/,'');await put('serverResult','');await sync()}
function requireResources(){const p=payload();if(p.cdn_mode==='local'&&!p.local_resource_directory){$('localResourceDir').focus();throw fail('launcher.error.resources_required')}}
async function requireProxy(){if($('proxyMode').value!=='manual')return;const value=$('proxyURL').value.trim();let u;try{u=new URL(value)}catch{}if(!u||u.protocol!=='http:'||u.username||u.password||u.search||u.hash||u.pathname!=='/'||!/^http:\/\/(?:\[[^\]]+\]|[^\s/:?#@]+):[0-9]+$/.test(value)||Number(value.slice(value.lastIndexOf(':')+1))<1||Number(value.slice(value.lastIndexOf(':')+1))>65535){const message=Component.translatable('launcher.error.proxy_invalid','http://127.0.0.1:7890');await put('proxyResult',message);$('proxyResult').className='inline-result error';$('proxyURL').focus();throw new Problem(message)}$('proxyURL').value=value;await put('proxyResult','');await sync()}
function setBusy(value){busy=value;document.querySelectorAll('button:not(.window-control),input,select').forEach(e=>{e.disabled=value});document.body.setAttribute('aria-busy',String(value))}
async function action(id,fn){if(busy||transitioning)return;const b=$(id),old=b.innerHTML;setBusy(true);b.textContent=t('launcher.operation.wait');try{await fn()}catch(e){const message=problemText(e);await show(message,true);if(scene==='directory'||editorKind==='directory'){await put('directoryResult',message);$('directoryResult').className='inline-result error'}if(scene==='server'||editorKind==='server'){await put('serverResult',message);$('serverResult').className='inline-result error'}}finally{b.innerHTML=old;setBusy(false)}}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function navigateScene(next){if(transitioning||scene===next)return;transitioning=true;const old=$(scene+'Scene'),target=$(next+'Scene');if(!reduced.matches){old.classList.add('is-leaving');$('veil').classList.add('play');await delay(570)}old.hidden=true;old.classList.remove('is-leaving','is-entering');scene=next;document.body.dataset.scene=next;target.hidden=false;target.classList.add('is-entering');$('journey').hidden=next==='desk'||next==='quit';document.querySelectorAll('[data-step]').forEach(e=>{const active=e.dataset.step===next;e.classList.toggle('active',active);if(active)e.setAttribute('aria-current','step');else e.removeAttribute('aria-current')});window.scrollTo({top:0,behavior:'instant'});$(next==='directory'?'directoryTitle':next==='server'?'serverTitle':next==='desk'?'deskTitle':'quitTitle').focus({preventScroll:true});if(!reduced.matches)await delay(680);$('veil').classList.remove('play');transitioning=false}
async function inspect(){requireDirectory();const r=await api('inspect',payload());await applyStatus(r.data);await show(r.text);return r}
async function openEditor(kind){if(busy||transitioning)return;editorKind=kind;await put('editorTitle',Component.translatable(kind==='directory'?'launcher.editor.directory':kind==='server'?'launcher.editor.server':'launcher.proxy.title'));$('editorContent').append($(kind+'Fields'));$('editor').showModal();$(kind==='directory'?'gameDir':kind==='server'?'origin':'proxyMode').focus()}
function closeEditor(){if(busy)return;$('editor').close()}
$('editor').addEventListener('close',async ()=>{if(editorKind)$(editorKind+'Home').append($(editorKind+'Fields'));editorKind=null;await sync()});
$('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
$('closeEditor').onclick=closeEditor;
$('doneEditor').onclick=async ()=>{try{if(editorKind==='server')await requireOrigin();else if(editorKind==='proxy')await requireProxy();else requireDirectory();closeEditor()}catch(e){await show(problemText(e),true)}};
$('editProxy').onclick=async ()=>await openEditor('proxy');$('proxyMode').addEventListener('change',async ()=>{await put('proxyResult','');await invalidate()});$('proxyURL').addEventListener('input',async ()=>{await put('proxyResult','');await invalidate()});
$('editDirectory').onclick=async ()=>await openEditor('directory');$('editServer').onclick=async ()=>await openEditor('server');
$('gameDir').addEventListener('input',async ()=>await invalidate(true));$('origin').addEventListener('input',async ()=>{await put('serverResult','');await invalidate()});$('localResourceDir').addEventListener('input',async ()=>await invalidate());document.querySelectorAll('input[name="cdn"]').forEach(e=>e.addEventListener('change',async ()=>await invalidate()));
$('browse').onclick=async ()=>await action('browse',async()=>{const previous=payload().game_directory;const r=await api('browse',{...payload(),dialog_title:t('launcher.dialog.game_directory')});if(r.data){await applyStatus(r.data);if(payload().game_directory!==previous)$('policy').hidden=true}await show(r.text)});
$('browseResources').onclick=async ()=>await action('browseResources',async()=>{const r=await api('browseResources',{...payload(),dialog_title:t('launcher.dialog.resource_directory')});if(r.data){$('localResourceDir').value=r.data.local_directory||'';await invalidate()}await show(r.text)});
$('inspect').onclick=async ()=>await action('inspect',inspect);$('refresh').onclick=async ()=>await action('refresh',inspect);
$('directoryNext').onclick=async ()=>await action('directoryNext',async()=>{requireDirectory();await sync();await navigateScene('server')});
$('serverBack').onclick=async ()=>{if(!busy)await navigateScene('directory')};
$('serverNext').onclick=async ()=>await action('serverNext',async()=>{await requireOrigin();await sync();await navigateScene('desk')});
$('checkResources').onclick=async ()=>await action('checkResources',async()=>{requireDirectory();await requireOrigin();requireResources();await requireProxy();const r=await api('resources',payload()),p=r.data||{},local=payload().local_resource_directory,v=value=>value||t('launcher.resources.missing');$('policy').hidden=false;await put('policy',{getString:()=>p.mode==='official'?`${t('launcher.resources.official.code')} · ${t('launcher.resources.policy_official')}`:p.mode==='local'?`${t('launcher.resources.local.code')} · ${p.local_directory||local}\nServerData · ${v(p.server_data_url)}\nGameData · ${v(p.game_data_url)}`:`${t('launcher.resources.server.code')} · ${t('launcher.resources.policy_server')}\nServerData · ${v(p.server_data_url)}\nGameData · ${v(p.game_data_url)}\nBundle · ${v(p.bundle_version)}\nGameData · ${v(p.game_data_version)}`});await show(r.text)});
async function saved(){savedSignature=signature();status.config=true;await sync()}
$('save').onclick=async ()=>await action('save',async()=>{requireDirectory();await requireOrigin();requireResources();await requireProxy();const r=await api('save',payload());await saved();await show(r.text)});
$('prepare').onclick=async ()=>await action('prepare',async()=>{requireDirectory();await requireOrigin();requireResources();await requireProxy();const r=await api('prepare',payload());await applyStatus(r.data);await saved();await show(r.text)});
$('patch').onclick=async ()=>await action('patch',async()=>{requireDirectory();await requireOrigin();requireResources();await requireProxy();const r=await api('patch',payload());await saved();await show(r.text)});
$('install').onclick=async ()=>await action('install',async()=>{requireDirectory();await requireOrigin();requireResources();await requireProxy();const r=await api('install',payload());status.bepinex=true;await saved();await show(r.text)});
$('launch').onclick=async ()=>await action('launch',async()=>{requireDirectory();await requireOrigin();requireResources();await requireProxy();const r=await api('launch',payload());await saved();await show(r.text)});
$('language').addEventListener('change',async e=>await setLocale(e.target.value,true));
$('windowMinimise').onclick=()=>window.runtime?.WindowMinimise();
$('windowMaximise').onclick=()=>window.runtime?.WindowToggleMaximise();
document.querySelector('.topbar').ondblclick=e=>{if(!e.target.closest('.window-controls,.lang-select'))window.runtime?.WindowToggleMaximise()};
$('windowClose').onclick=async ()=>{clearTimeout(toastTimer);try{bridge().Quit().catch(async error=>await show(problemText(error),true))}catch(error){await show(problemText(error),true)}};
$('gameDir').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();(editorKind?$('inspect'):$('directoryNext')).click()}});$('origin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();(editorKind?$('doneEditor'):$('serverNext')).click()}});
async function initialize(){setBusy(true);try{const initial=await bridge().Initialize();HOST_PLATFORM=initial.platform;INITIAL_CDN=initial.cdn_mode;AUTO_OPEN=initial.auto_open;$('gameDir').value=initial.game_directory||'';$('origin').value=initial.server_origin||'http://127.0.0.1:8080';$('localResourceDir').value=initial.local_resource_directory||'';$('proxyURL').value=initial.proxy_url||'';$('proxyMode').value=initial.proxy_url?'manual':'direct';$('clientReleaseVersion').textContent=initial.client_version||'';$('gameReleaseVersion').textContent=initial.game_version||'';$('persistentLogPath').textContent=initial.log_path||'';const initialRadio=document.querySelector(`input[name="cdn"][value="${CSS.escape(INITIAL_CDN)}"]`);if(initialRadio)initialRadio.checked=true;if(HOST_PLATFORM==='darwin'){const description=$('directoryDescription');$('gameDir').dataset.i18nAttr='placeholder:launcher.directory.placeholder_mac';description.dataset.i18n='launcher.directory.description_mac';description.dataset.i18nCode='BrownDust II.app';await applyStatic()}await sync();if(AUTO_OPEN){await inspect();await saved();await navigateScene('desk')}}catch(error){await show(problemText(error),true)}finally{setBusy(false)}}
const updateNotes=notes=>!notes?'':typeof notes==='string'?notes:notes[locale]||notes.en_us||Object.values(notes).find(Boolean)||'';
function formatBytes(bytes){const mb=bytes>=1048576,value=bytes/(mb?1048576:1024);try{return new Intl.NumberFormat(HTML_LANG[locale],{style:'unit',unit:mb?'megabyte':'kilobyte',maximumFractionDigits:1}).format(value)}catch{return value.toFixed(1)+(mb?' MB':' KB')}}
function formatDate(value){const date=new Date(value+'T00:00:00Z');if(!/^\d{4}-\d{2}-\d{2}$/.test(value)||isNaN(date))return value;try{return date.toLocaleDateString(HTML_LANG[locale],{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'})}catch{return value}}
const lines=(...items)=>items.filter(Boolean).join('\n');
const updateMeta=async item=>[item.date?await dynamicText('update.released',formatDate(String(item.date))):'',item.bytes>0?await dynamicText('update.size',formatBytes(item.bytes)):''].filter(Boolean).join(' · ');
async function renderUpdates(u) {
  const renderPass = beginRender('launcher-updates');
  try {
    if (!u) return;
    lastUpdate = u;
    const message = u.message && u.message.key
      ? rendered(await dynamicText(u.message.key, ...(u.message.args || [])), renderPass) : '';
    let head = '', body = '', label = '', act = '';
    if (u.busy) {
      const pct = u.total ? Math.floor(u.done * 100 / u.total) : 0;
      head = t(u.busy === 'checking' || u.busy === 'preparing' ? 'update.' + u.busy : 'update.busy');
      body = u.busy === 'checking' || u.busy === 'preparing' ? '' : u.busy === 'downloading' ? rendered(await dynamicText('update.downloading', pct), renderPass)
        : t(u.busy === 'restarting' ? 'update.restarting' : u.busy === 'checking' ? 'update.checking'
          : u.busy === 'preparing' ? 'update.preparing' : 'update.installing');
    } else if (u.launcher) {
      head = rendered(await dynamicText('update.launcher.available', u.launcher.version), renderPass);
      body = lines(message, rendered(await updateMeta(u.launcher), renderPass), updateNotes(u.launcher.notes));
      label = t(u.launcher.ready ? 'update.launcher.restart' : 'update.launcher.download');
      act = u.launcher.ready ? 'apply' : 'check';
    } else if (u.game) {
      head = rendered(await dynamicText('update.game.available', u.game.version), renderPass);
      body = lines(t('update.game.exit_hint'), u.error, ...(u.waiting || []));
      label = t('update.game.update'); act = 'check';
    } else if (u.plugins) {
      head = rendered(await dynamicText('update.plugins.available', u.plugins.version), renderPass);
      body = lines(message, rendered(await updateMeta(u.plugins), renderPass), updateNotes(u.plugins.notes));
      label = t('update.plugins.update'); act = 'check';
    } else if (u.waiting && u.waiting.length) {
      head = t('update.plugins.ready'); body = lines(message, t('update.plugins.ready_hint'), ...u.waiting);
    } else if (u.error) {
      head = t('update.failed'); body = lines(message, u.error); label = t('update.retry'); act = 'check';
    } else if (message) head = message;
    $('updateBox').hidden = !head;
    $('updateTitle').textContent = head; $('updateNotes').textContent = body;
    const button = $('updateAction');
    button.hidden = !act; button.textContent = label; button.dataset.act = act;
  } catch (error) { if (error !== staleRender) throw error; }
}
async function updateAction(){const act=$('updateAction').dataset.act;const method=act==='apply'?'ApplyLauncherUpdate':'CheckUpdates';let data;try{data=await bridge()[method]()}catch(error){throw new Problem(problemText(error))}await show(backendText(data&&data.message))}
$('updateAction').onclick=async ()=>await action('updateAction',updateAction);
async function pollUpdates(){try{await renderUpdates(await bridge().UpdateStatus())}catch(error){await show(Component.literal(error.message||String(error)),true)}}
async function start(){await loadTranslations();await setLocale(detectLocale(),false);setInterval(pollUpdates,4000);setTimeout(pollUpdates,1500);await initialize()}
window.addEventListener('unhandledrejection',event=>{console.error(event.reason);const box=$('toast');box.textContent=String(event.reason&&event.reason.message||event.reason);box.className='toast show error';clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.className='toast',5200)});
await start();
})();
