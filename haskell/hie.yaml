cradle:
  multi:
    - path: "./state-migrator/Setup.hs"
      config:
        cradle:
          none:
    - path: "./state-migrator/src"
      config:
        cradle:
          cabal:
            component: "lib:bd2-state-migrator"
    - path: "./state-migrator/app"
      config:
        cradle:
          cabal:
            component: "exe:bd2-state"
    - path: "./state-migrator/test"
      config:
        cradle:
          cabal:
            component: "test:state-migrator-test"
